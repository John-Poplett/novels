# Weekly: the same check against the newest CRAN packages, not renv.lock.
#
# Not a required status. Its job is to say, before it matters, that CRAN has
# moved: green means the lockfile can be advanced (AGENTS.md, "Upgrading
# dependencies"); red names the package that would break the project. The
# summary lists the packages newer than renv.lock, separately from those the
# repository has not caught up with yet.

name: latest

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays, 09:00 UTC
  workflow_dispatch:

jobs:
  latest:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOVELS_ARCHIVE_URL: https://f005.backblazeb2.com/file/public-johnpoplett-09477/novels.7z

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # Config/Needs/dev (devtools, roxygen2, renv, tarchetypes) is
          # declared in DESCRIPTION; rcmdcheck drives the check below.
          extra-packages: |
            any::rcmdcheck
            any::jsonlite
          needs: dev

      # Three cases, kept apart: newer than the lockfile (the upgrade
      # candidates, the point of this job); behind it (the repository has not
      # caught up with a recent CRAN release -- PPM snapshots daily); and not
      # installed (build-time-only LinkingTo packages, which binaries do not
      # need, or dependencies the newest versions dropped), listed on one line.
      - name: Packages newer than renv.lock
        run: |
          Rscript -e '
            lock <- jsonlite::fromJSON("renv.lock")$Packages
            ip <- installed.packages()
            locked <- vapply(lock, function(x) x$Version, character(1))
            have <- setNames(rep(NA_character_, length(locked)), names(locked))
            present <- intersect(names(locked), rownames(ip))
            have[present] <- ip[present, "Version"]
            cmp <- mapply(function(h, l) if (is.na(h)) NA_integer_ else utils::compareVersion(h, l),
                          have, locked)
            table_of <- function(sel, col) {
              if (!any(sel)) return("None.")
              c(sprintf("| package | locked | %s |", col), "|---|---|---|",
                sprintf("| %s | %s | %s |", names(locked)[sel], locked[sel], have[sel]))
            }
            absent <- names(locked)[is.na(cmp)]
            out <- c("### Newer than renv.lock: upgrade candidates", "",
                     table_of(!is.na(cmp) & cmp > 0, "newest"), "",
                     "### Behind renv.lock: the repository has not caught up yet", "",
                     table_of(!is.na(cmp) & cmp < 0, "repository has"), "",
                     sprintf("Locked but not installed here (%d; build-time only, or not needed by the newest versions): %s",
                             length(absent), if (length(absent)) paste(absent, collapse = ", ") else "none"))
            cat(out, sep = "\n", file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE)
            cat(out, sep = "\n")'

      - name: Build the corpus
        run: Rscript -e 'targets::tar_make(names = "novels_data")'

      - name: Regenerate Rd files
        run: Rscript -e 'roxygen2::roxygenise()'

      - name: Fast test loop
        run: Rscript -e 'pkgload::load_all(quiet = TRUE); testthat::test_dir("tests/testthat")'

      - name: R CMD check
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(
            build_args = c("--no-manual", "--no-build-vignettes"),
            args = c("--no-manual", "--no-build-vignettes"),
            error_on = "error", check_dir = "check")'
