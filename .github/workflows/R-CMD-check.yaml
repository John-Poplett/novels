# Minimal continuous integration.
#
# The gate this guards is `make check` (see AGENTS.md). Two things make CI
# more involved here than for a plain package:
#
# * `data/novels.rda` is git-ignored and produced by the pipeline, so the
#   corpus must be built before anything else runs -- including roxygen.
#   `roxygenise()` calls `load_all()`, and `LazyData: true` plus the `novels`
#   dataset doc in R/data.R make it require the dataset: without it the step
#   fails with `'novels' is not an exported object from 'namespace:novels'`,
#   which names neither the cause nor the fix. Only `novels_data` is built --
#   the modelling targets are not needed to test the package and would add
#   hours.
# * `man/` is git-ignored, so the Rd files must be regenerated before the
#   check or it reports stale codoc mismatches (F8/F17).
#
# Vignettes are not built, which necessarily yields the two `inst/doc`
# WARNINGs documented in AGENTS.md. The job therefore fails on errors only,
# matching the level-2 check rather than the release gate.

name: R-CMD-check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Pinned in code by SHA-256 in _targets.R, so a moved archive aborts
      # rather than silently changing the corpus.
      NOVELS_ARCHIVE_URL: https://f005.backblazeb2.com/file/public-johnpoplett-09477/novels.7z

    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: make lint

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # rcmdcheck drives the final check-r-package step and is not a
          # DESCRIPTION dependency, so it must be named here or the step dies
          # with "there is no package called 'rcmdcheck'" after every real
          # check has already passed.
          extra-packages: |
            any::pkgload
            any::rcmdcheck
            any::roxygen2
            any::tarchetypes
          needs: check

      # Must precede the Rd step: roxygen loads the package and needs the
      # dataset present (see the header note).
      - name: Build the corpus
        run: Rscript -e 'targets::tar_make(names = "novels_data")'

      - name: Regenerate Rd files
        run: Rscript -e 'roxygen2::roxygenise()'

      - name: Fast test loop
        run: Rscript -e 'pkgload::load_all(quiet = TRUE); testthat::test_dir("tests/testthat")'

      - uses: r-lib/actions/check-r-package@v2
        with:
          build_args: 'c("--no-manual", "--no-build-vignettes")'
          args: 'c("--no-manual", "--no-build-vignettes")'
          error-on: '"error"'
