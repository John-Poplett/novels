# Minimal continuous integration.
#
# The gate this guards is `make check` (see AGENTS.md). Two things make CI
# more involved here than for a plain package:
#
# * `data/novels.rda` is git-ignored and produced by the pipeline, so the
#   corpus must be built before anything else runs -- including roxygen.
#   `roxygenise()` calls `load_all()`, and `LazyData: true` plus the `novels`
#   dataset doc in R/data.R make it require the dataset: without it the step
#   fails with `'novels' is not an exported object from 'namespace:novels'`,
#   which names neither the cause nor the fix. Only `novels_data` is built --
#   the modelling targets are not needed to test the package (they build in
#   about 13 minutes on gpu-box, longer on a 2-core runner).
# * `man/` is git-ignored, so the Rd files must be regenerated before the
#   check or it reports stale codoc mismatches (F8/F17).
#
# Vignettes are not built, which necessarily yields the two `inst/doc`
# WARNINGs documented in AGENTS.md. The job therefore fails on errors only,
# matching the level-2 check rather than the release gate.
#
# Packages come from renv.lock, version for version (binaries from Posit
# Package Manager; the lockfile's repository is overridden for speed, not for
# versions), so a red `check` means the commit broke something, never that
# CRAN moved. CRAN's moving is watched separately by latest.yaml, weekly.
# The job keeps its name: branch protection on master requires `check`.

name: R-CMD-check

on:
  push:
  pull_request:

jobs:
  check:
    # Pinned, not ubuntu-latest: the binaries are built for 24.04 ("noble")
    # and link its system libraries. ubuntu-latest became 26.04 in 2026, and
    # stringi then failed to load (libicui18n.so.74 missing). When GitHub
    # retires 24.04, move this and the URL below together.
    runs-on: ubuntu-24.04
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Pinned in code by SHA-256 in _targets.R, so a moved archive aborts
      # rather than silently changing the corpus.
      NOVELS_ARCHIVE_URL: https://f005.backblazeb2.com/file/public-johnpoplett-09477/novels.7z

    steps:
      - uses: actions/checkout@v4

      - name: Lint
        run: make lint

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: renv   # the R version recorded in renv.lock

      # Every system library the locked packages need on Ubuntu 24.04, as
      # renv computes it; regenerate after a lockfile change with
      #   renv::sysreqs(names(jsonlite::fromJSON("renv.lock")$Packages),
      #                 report = FALSE, check = FALSE, distro = "ubuntu:24.04")
      # (a hand-picked list missed libicu, then libgit2, one CI run each).
      - name: System libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake git libarchive-dev \
            libcurl4-openssl-dev libfontconfig1-dev libfreetype6-dev \
            libfribidi-dev libgit2-dev libglpk-dev libharfbuzz-dev libicu-dev \
            libjpeg-dev libpng-dev libssl-dev libtiff-dev libuv1-dev \
            libwebp-dev libx11-dev libxml2-dev make pandoc zlib1g-dev

      - uses: actions/cache@v4
        with:
          path: ~/.cache/R/renv
          key: renv-${{ runner.os }}-${{ hashFiles('renv.lock') }}
          restore-keys: renv-${{ runner.os }}-

      - name: Packages from renv.lock
        env:
          RENV_CONFIG_REPOS_OVERRIDE: https://packagemanager.posit.co/cran/__linux__/noble/latest
        run: |
          Rscript -e 'install.packages("renv", repos = Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE"))'
          Rscript -e 'renv::restore(lockfile = "renv.lock", library = .libPaths()[1], prompt = FALSE)'

      # Must precede the Rd step: roxygen loads the package and needs the
      # dataset present (see the header note).
      - name: Build the corpus
        run: Rscript -e 'targets::tar_make(names = "novels_data")'

      - name: Regenerate Rd files
        run: Rscript -e 'roxygen2::roxygenise()'

      - name: Fast test loop
        run: Rscript -e 'pkgload::load_all(quiet = TRUE); testthat::test_dir("tests/testthat")'

      # rcmdcheck is locked (it comes with devtools), so this is the same
      # call check-r-package would make, without installing anything else.
      - name: R CMD check
        run: |
          Rscript -e 'rcmdcheck::rcmdcheck(
            build_args = c("--no-manual", "--no-build-vignettes"),
            args = c("--no-manual", "--no-build-vignettes"),
            error_on = "error", check_dir = "check")'
